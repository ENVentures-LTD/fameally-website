name: Publish reviewed website

# Review before pushing main: every push to main publishes the validated site.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      indexnow_plan: ${{ steps.indexnow.outputs.plan }}
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Validate source and sharing behaviour
        run: |
          node scripts/validate-site.mjs
          node scripts/test-article-share.mjs
          node --test scripts/test-indexnow.mjs
          node --test scripts/test-site-files.mjs
      - name: Build and validate public files
        run: |
          node scripts/build-site.mjs
          node scripts/validate-site.mjs _site
      - name: Compare public pages with the live site for IndexNow
        id: indexnow
        run: |
          node scripts/indexnow.mjs prepare "$RUNNER_TEMP/indexnow-plan.json"
          node --input-type=module -e 'import fs from "node:fs"; const plan = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/indexnow-plan.json", "utf8")); fs.appendFileSync(process.env.GITHUB_OUTPUT, "plan=" + JSON.stringify(plan) + "\n");'
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      # upload-pages-artifact excludes hidden paths, including required .well-known files.
      - name: Package public site including app association files
        run: |
          tar --dereference --hard-dereference --directory _site -cf "$RUNNER_TEMP/artifact.tar" .
          tar -tf "$RUNNER_TEMP/artifact.tar" | grep -Fx './.well-known/assetlinks.json'
          tar -tf "$RUNNER_TEMP/artifact.tar" | grep -Fx './.well-known/apple-app-site-association'
      - name: Upload public site only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish reviewed site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  indexnow:
    name: Notify IndexNow after publishing
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out published revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Verify live key and submit changed URLs
        env:
          INDEXNOW_PLAN: ${{ needs.build.outputs.indexnow_plan }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; fs.writeFileSync(process.env.RUNNER_TEMP + "/indexnow-plan.json", process.env.INDEXNOW_PLAN);'
          node scripts/indexnow.mjs submit "$RUNNER_TEMP/indexnow-plan.json"
